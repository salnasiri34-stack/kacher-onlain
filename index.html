<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطلب الإلكتروني - طلبات العملاء</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase Firestore (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfQcJRBmNEZsg3MKQjojiQCoMwLK rjfws",
            authDomain: "kacher-71f82.firebaseapp.com",
            projectId: "kacher-71f82",
            storageBucket: "kacher-71f82.firebasestorage.app",
            messagingSenderId: "628227415674",
            appId: "1:628227415674:web:ccc3354fa405b7ae34a5c3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.dbFns = { collection, addDoc, getDocs, onSnapshot };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #3b82f6;
            --border-color: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .product-card p {
            color: var(--success);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--success); }

        .cart-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        input, textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-store"></i> المتجر الإلكتروني للطلبات</h1>
            <p style="color: var(--text-secondary);">اختر منتجاتك وسوف يتم إرسال طلبك مباشرة إلى النظام.</p>
        </header>

        <!-- قائمة المنتجات المتاحة -->
        <div style="margin-bottom: 15px;">
            <h3><i class="fa-solid fa-utensils"></i> المنتجات المتاحة</h3>
        </div>
        <div id="customer-products-grid" class="products-grid">
            <p style="color: var(--text-secondary);">جاري تحميل المنتجات...</p>
        </div>

        <!-- سلة الطلب الخاصة بالعميل -->
        <div class="cart-section">
            <h3><i class="fa-solid fa-cart-shopping"></i> سلة الطلبات</h3>
            <div id="cart-items-container" style="margin: 10px 0; max-height: 200px; overflow-y: auto;">
                <p style="color: var(--text-secondary);">السلة فارغة حالياً.</p>
            </div>
            
            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px;">
                <strong>المجموع الإجمالي: <span id="cart-total-price" style="color: var(--success);">0</span> ر.س</strong>
            </div>

            <input type="text" id="customer-name" placeholder="اسم العميل الكريم / رقم الطاولة">
            <textarea id="customer-kitchen-notes" placeholder="ملاحظات إضافية للمطبخ (اختياري)..." rows="2"></textarea>
            
            <button class="btn btn-success" onclick="submitCustomerOrder()"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب للكاشير</button>
        </div>
    </div>

    <footer>
        حقوق النشر محفوظة &copy; 2026 — sulaiman alnasiri
    </footer>

    <script>
        let productsList = [];
        let cart = [];

        window.addEventListener('firebase-ready', () => {
            fetchProductsForCustomer();
        });

        // جلب المنتجات اللحظية من Firebase
        function fetchProductsForCustomer() {
            window.dbFns.onSnapshot(window.dbFns.collection(window.db, "products"), (snapshot) => {
                productsList = [];
                let html = '';
                snapshot.forEach((doc) => {
                    let p = doc.data();
                    p.id = doc.id;
                    productsList.push(p);
                    html += `
                        <div class="product-card">
                            <div>
                                <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
                                <h3>${p.name}</h3>
                                <p>${p.price} ر.س</p>
                            </div>
                            <button class="btn" onclick="addToCart('${p.id}')">إضافة للسلة</button>
                        </div>
                    `;
                });
                document.getElementById('customer-products-grid').innerHTML = html || '<p style="color:var(--text-secondary);">لا توجد منتجات متاحة حالياً.</p>';
            });
        }

        function addToCart(productId) {
            let product = productsList.find(p => p.id === productId);
            if(!product) return;

            let existing = cart.find(item => item.id === productId);
            if(existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, qty: 1, customOption: "عادي" });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let container = document.getElementById('cart-items-container');
            let total = 0;
            if(cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">السلة فارغة حالياً.</p>';
                document.getElementById('cart-total-price').innerText = '0';
                return;
            }

            let html = '';
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <span>${item.name} (×${item.qty})</span>
                        <div>
                            <span style="margin-left: 10px;">${item.price * item.qty} ر.س</span>
                            <button onclick="removeFromCart(${index})" style="background:var(--danger); color:white; border:none; padding:2px 6px; border-radius:4px; cursor:pointer;">X</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cart-total-price').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        async function submitCustomerOrder() {
            let customerName = document.getElementById('customer-name').value.trim();
            let kitchenNotes = document.getElementById('customer-kitchen-notes').value.trim();

            if(!customerName) {
                alert("الرجاء إدخال اسمك الكريم أو رقم الطاولة قبل إرسال الطلب.");
                return;
            }
            if(cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            try {
                // جلب عدد الطلبات الحالي لترتيب تسلسل رقم الطلب تلقائياً
                const querySnapshot = await window.dbFns.getDocs(window.dbFns.collection(window.db, "orders"));
                let sequentialNumber = querySnapshot.size + 1;

                await window.dbFns.addDoc(window.dbFns.collection(window.db, "orders"), {
                    orderNumber: sequentialNumber,
                    tableName: customerName,
                    tableNumber: customerName, // متوافق مع نظام الكاشير والمطبخ
                    items: cart,
                    kitchenNotes: kitchenNotes || "لا توجد ملاحظات",
                    total: totalAmount,
                    status: "قيد التجهيز",
                    source: "online", // تمييزه لكي يظهر في قسم طلبات الإنترنت لدى المطبخ
                    timestamp: new Date().toLocaleString()
                });

                alert("تم إرسال طلبك بنجاح إلى النظام!");
                cart = [];
                updateCartUI();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-kitchen-notes').value = '';
            } catch(e) {
                alert("حدث خطأ أثناء إرسال الطلب: " + e.message);
            }
        }
    </script>
</body>
</html>
